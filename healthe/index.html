<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Health-E — Download the App</title>
  <meta name="description" content="Download Health-E on the App Store or Google Play.">
  <meta name="robots" content="noindex, follow">

  <!-- Redirect mobile users instantly, before paint -->
  <script>
    (function () {
      var ua = navigator.userAgent;
      if (/iPhone|iPad|iPod/i.test(ua)) {
        window.location.replace('https://apps.apple.com/us/app/health-e/id6781219446');
      } else if (/Android/i.test(ua)) {
        window.location.replace('https://play.google.com/store/apps/details?id=com.nosillaandco.healthe&pcampaignid=web_share');
      }
    })();
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green:       #1a6b3a;
      --green-light: #27a359;
      --text:        #1a1a2e;
      --text-muted:  #5a6478;
      --border:      #dde2ea;
      --bg:          #ffffff;
      --bg-subtle:   #f7f9fc;
    }

    html { height: 100%; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      font-size: 16px;
      -webkit-font-smoothing: antialiased;
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
    }

    .card {
      max-width: 480px;
      width: 100%;
      text-align: center;
    }

    .icon {
      width: 96px;
      height: 96px;
      border-radius: 22px;
      overflow: hidden;
      display: inline-block;
      margin-bottom: 28px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
    }

    .icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 10px;
    }

    .tagline {
      color: var(--text-muted);
      font-size: 1.05rem;
      margin-bottom: 40px;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .badge-link {
      display: inline-block;
      transition: transform 0.12s ease, opacity 0.12s ease;
    }

    .badge-link:hover {
      transform: translateY(-2px);
      opacity: 0.88;
    }

    .badge-link:active { transform: translateY(0); }

    .badge-link img {
      height: 60px;
      width: auto;
      display: block;
    }

    .badge-link.badge-google img {
      /* Google badge has built-in padding — compensate visually */
      height: 72px;
      margin: -6px 0;
    }

    footer {
      margin-top: 48px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    footer a { color: var(--text-muted); text-decoration: underline; }
  </style>
</head>
<body>

  <div class="card">

    <div class="icon">
      <img src="icon.png" alt="Health-E app icon">
    </div>

    <h1>Health-E</h1>
    <p class="tagline">Choose your platform to download the app.</p>

    <div class="buttons">

      <!-- Official App Store badge (hosted by Apple) -->
      <a class="badge-link badge-apple"
         href="https://apps.apple.com/us/app/health-e/id6781219446"
         target="_blank" rel="noopener">
        <img src="https://tools.applemediaservices.com/api/badges/download-on-the-app-store/black/en-us?size=250x83"
             alt="Download on the App Store">
      </a>

      <!-- Official Google Play badge (hosted by Google) -->
      <a class="badge-link badge-google"
         href="https://play.google.com/store/apps/details?id=com.nosillaandco.healthe&pcampaignid=web_share"
         target="_blank" rel="noopener">
        <img src="https://play.google.com/intl/en_us/badges/static/images/badges/en_badge_web_generic.png"
             alt="Get it on Google Play">
      </a>

    </div>
  </div>

  <footer>
    A product by <a href="https://xfiresrl.com" target="_blank" rel="noopener">XFire SRL</a>
  </footer>

</body>
</html>
