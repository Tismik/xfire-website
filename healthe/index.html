<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Health-E — Download the App</title>
  <meta name="description" content="Download Health-E on the App Store or Google Play.">
  <meta name="robots" content="noindex, follow">

  <!-- Redirect mobile users instantly, before paint -->
  <script>
    (function () {
      var ua = navigator.userAgent;
      if (/iPhone|iPad|iPod/i.test(ua)) {
        window.location.replace('https://apps.apple.com/us/app/health-e/id6781219446');
      } else if (/Android/i.test(ua)) {
        window.location.replace('https://play.google.com/store/apps/details?id=com.nosillaandco.healthe&pcampaignid=web_share');
      }
    })();
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green:       #1a6b3a;
      --green-light: #27a359;
      --text:        #1a1a2e;
      --text-muted:  #5a6478;
      --border:      #dde2ea;
      --bg:          #ffffff;
      --bg-subtle:   #f7f9fc;
    }

    html { height: 100%; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      font-size: 16px;
      -webkit-font-smoothing: antialiased;
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
    }

    .card {
      max-width: 480px;
      width: 100%;
      text-align: center;
    }

    .icon {
      width: 96px;
      height: 96px;
      border-radius: 22px;
      background: linear-gradient(145deg, var(--green), var(--green-light));
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 28px;
      box-shadow: 0 8px 24px rgba(39, 163, 89, 0.25);
    }

    .icon svg {
      width: 52px;
      height: 52px;
      fill: #fff;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 10px;
    }

    .tagline {
      color: var(--text-muted);
      font-size: 1.05rem;
      margin-bottom: 40px;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 18px 28px;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
      cursor: pointer;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.12);
      text-decoration: none;
    }

    .btn:active { transform: translateY(0); }

    .btn-apple {
      background: #000;
      color: #fff;
    }

    .btn-google {
      background: var(--bg-subtle);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn svg { flex-shrink: 0; }

    .btn-label { text-align: left; }
    .btn-label small { display: block; font-size: 0.72rem; font-weight: 400; opacity: 0.75; margin-bottom: 1px; }
    .btn-label span { font-size: 1.05rem; }

    footer {
      margin-top: 48px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    footer a { color: var(--text-muted); text-decoration: underline; }
  </style>
</head>
<body>

  <div class="card">

    <!-- App icon placeholder -->
    <div class="icon">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 21.593c-5.63-5.539-11-10.297-11-14.402C1 3.314 3.36 1 6.28 1c1.735 0 3.383.737 4.938 2.326C12.495 1.742 14.148 1 15.72 1 18.64 1 21 3.314 21 7.191c0 4.105-5.37 8.863-11 14.402z"/>
      </svg>
    </div>

    <h1>Health-E</h1>
    <p class="tagline">Choose your platform to download the app.</p>

    <div class="buttons">

      <!-- App Store -->
      <a class="btn btn-apple" href="https://apps.apple.com/us/app/health-e/id6781219446" target="_blank" rel="noopener">
        <!-- Apple logo -->
        <svg width="26" height="26" viewBox="0 0 814 1000" fill="#fff" xmlns="http://www.w3.org/2000/svg">
          <path d="M788.1 340.9c-5.8 4.5-108.2 62.2-108.2 190.5 0 148.4 130.3 200.9 134.2 202.2-.6 3.2-20.7 71.9-68.7 141.9-42.8 61.6-87.5 123.1-155.5 123.1s-85.5-39.5-164-39.5c-76 0-103.7 40.8-165.9 40.8s-105-57.8-155.5-127.4C46 380.8 43 289.2 43 285.9c0-159.9 104.5-244.6 208.4-244.6 64.9 0 119.3 42.5 163.4 42.5 41.6 0 106.5-44.8 180.9-44.8 30 0 130.9 2.6 198.3 99.2zm-234-181.5c31.1-36.9 53.1-88.1 53.1-139.3 0-7.1-.6-14.3-1.9-20.1-50.6 1.9-110.8 33.7-147.1 75.8-28.5 32.4-55.1 83.6-55.1 135.5 0 7.8 1.3 15.6 1.9 18.1 3.2.6 8.4 1.3 13.6 1.3 45.4 0 102.5-30.4 135.5-71.3z"/>
        </svg>
        <div class="btn-label">
          <small>Download on the</small>
          <span>App Store</span>
        </div>
      </a>

      <!-- Google Play -->
      <a class="btn btn-google" href="https://play.google.com/store/apps/details?id=com.nosillaandco.healthe&pcampaignid=web_share" target="_blank" rel="noopener">
        <!-- Google Play triangle logo -->
        <svg width="26" height="26" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M3.18 23.76c.3.17.63.24.97.2l13.08-11.96-3.07-3.07L3.18 23.76z" fill="#EA4335"/>
          <path d="M22.13 10.5l-2.93-1.69-3.3 3.01 3.3 3.02 2.96-1.71a1.67 1.67 0 0 0 0-2.63z" fill="#FBBC04"/>
          <path d="M4.15.24A1.67 1.67 0 0 0 3.18.44L14.16 11.5l3.07-3.07L4.15.24z" fill="#4285F4"/>
          <path d="M3.18.44c-.3.18-.5.5-.5.91v21.3c0 .41.2.73.5.91l11-11.06L3.18.44z" fill="#34A853"/>
        </svg>
        <div class="btn-label">
          <small>Get it on</small>
          <span>Google Play</span>
        </div>
      </a>

    </div>
  </div>

  <footer>
    A product by <a href="https://xfiresrl.com" target="_blank" rel="noopener">XFire SRL</a>
  </footer>

</body>
</html>
